# =============================================================================
# STM32MP257F-DK M33 Zephyr — pulse generator application config
# =============================================================================

# --- IPC to Linux A35 via RPMsg/OpenAMP + remoteproc resource table ---
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# --- Serial: kept enabled but NOT as printk destination (see RAM console below) ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

# --- LOG: minimal mode routes LOG_* through printk() → RAM console ---
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- RAM console: M33 logs visible from Linux via debugfs trace0 ---
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192

# --- Heap required by libmetal / OpenAMP ---
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096

# --- GPIO (on-board user LED) ---
CONFIG_GPIO=y

# --- STM32 LL TIM (direct register access for TIM2 PWM) ---
CONFIG_APP_USE_STM32_LL_TIM=y

# --- STM32 LL ADC (direct register access for ADC3, no Zephyr ADC driver) ---
CONFIG_APP_USE_STM32_LL_ADC=y
