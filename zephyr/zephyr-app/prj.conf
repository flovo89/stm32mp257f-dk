# =============================================================================
# STM32MP257F-DK M33 Zephyr application config
# =============================================================================

# --- IPC to Linux A35 via RPMsg/OpenAMP + remoteproc resource table ---
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# --- Serial hardware enabled but NOT as printk/console destination ---
# uart_console_init (PRE_KERNEL_1, priority 60) runs after ram_console_init
# (same priority, later link order) and replaces the printk hook with UART,
# making trace0 permanently empty.  Disabling UART_CONSOLE keeps printk
# pointed at the RAM console so trace0 captures all output.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

# --- LOG: minimal mode routes LOG_* through printk() → RAM console ---
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3

# --- RAM console: M33 logs visible from Linux via debugfs trace0 ---
CONFIG_RAM_CONSOLE=y
CONFIG_RAM_CONSOLE_BUFFER_SIZE=8192

# --- Heap required by libmetal / OpenAMP ---
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096

# --- GPIO (on-board user LED, LD9) ---
CONFIG_GPIO=y

# --- STM32 LL ADC (direct register access, no Zephyr ADC driver) ---
# ADC1 channels 2 & 3 read via LL HAL, streamed over RPMsg.
# USE_STM32_LL_ADC is a hidden symbol selected via APP_USE_STM32_LL_ADC in Kconfig.
CONFIG_APP_USE_STM32_LL_ADC=y
