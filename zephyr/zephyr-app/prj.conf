# =============================================================================
# STM32MP257F-DK M33 Zephyr application config
# =============================================================================

# --- IPC to Linux A35 via RPMsg/OpenAMP + remoteproc resource table ---
CONFIG_IPM=y
CONFIG_OPENAMP=y
CONFIG_OPENAMP_RSC_TABLE=y
CONFIG_OPENAMP_RSC_TABLE_NUM_RPMSG_BUFF=8
CONFIG_OPENAMP_MASTER=n

# --- UART console (UART5 on STM32MP257F-DK, zephyr,console in board DTS) ---
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y

# --- Heap required by libmetal / OpenAMP ---
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096

# --- GPIO (on-board user LED, LD9) ---
CONFIG_GPIO=y
