globals :
{
    verbose  = true;
    loglevel = 5;
    syslog   = true;
};

/* Board identity — SWUpdate will reject packages that don't match */
identify : (
    { name = "BOARD";       value = "stm32mp257f-dk"; },
    { name = "HW_REVISION"; value = "1.0"; }
);

/* Web interface — push updates with:
 *   curl -F "swupdate=@update.swu" http://192.168.7.80:8080/upload
 */
webserver :
{
    port = 8080;
};

/*
 * Suricatta (hawkBit polling daemon) — configure if using a hawkBit server.
 * Leave commented out for standalone/curl-push operation.
 *
 * suricatta :
 * {
 *     url    = "https://your-hawkbit-server";
 *     id     = "stm32mp257f-dk-001";
 *     tenant = "DEFAULT";
 *     polldelay = 45;
 * };
 */
