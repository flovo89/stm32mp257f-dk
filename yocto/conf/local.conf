# =============================================================================
# STM32MP257F-DK — Yocto Scarthgap local.conf
# =============================================================================

# STM32MP257F-DK: dual Cortex-A35 + Cortex-M33
# Machine definition provided by meta-st-stm32mp
MACHINE ?= "stm32mp25-disco"

# Use standard Yocto 'poky' distro as base.
# ST's openstlinux distros (weston/eglfs) can be used instead if you need
# their full stack; for a headless/server image poky is simpler.
DISTRO ?= "poky"

# ---------------------------------------------------------------------------
# Build performance
# ---------------------------------------------------------------------------
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE     ?= "-j ${@oe.utils.cpu_count()}"

# Shared download + sstate caches survive rebuilds and branch switches
DL_DIR     ?= "${TOPDIR}/../../downloads"
SSTATE_DIR ?= "${TOPDIR}/../../sstate-cache"

# ---------------------------------------------------------------------------
# Init system
# ---------------------------------------------------------------------------
DISTRO_FEATURES:append = " systemd usrmerge"
VIRTUAL-RUNTIME_init_manager                  = "systemd"
VIRTUAL-RUNTIME_initscripts                   = "systemd-compat-units"
DISTRO_FEATURES_BACKFILL_CONSIDERED:append    = " sysvinit"

# ---------------------------------------------------------------------------
# Image output formats
# ext4  → written directly to SD rootfs partition
# tar.gz → useful for NFS-root development
# ---------------------------------------------------------------------------
IMAGE_FSTYPES = "ext4 tar.gz ext4.gz"

# ---------------------------------------------------------------------------
# Image features
# debug-tweaks: empty root password, allow root SSH
# ---------------------------------------------------------------------------
EXTRA_IMAGE_FEATURES ?= "debug-tweaks ssh-server-openssh"

# Serial console (STM32MP UART4 = ttySTM0)
SERIAL_CONSOLES ?= "115200;ttySTM0"

# ---------------------------------------------------------------------------
# Preferred BSP providers — ST-specific packages
# ---------------------------------------------------------------------------
PREFERRED_PROVIDER_virtual/bootloader       ?= "u-boot-stm32mp"
PREFERRED_PROVIDER_virtual/trusted-firmware-a ?= "tf-a-stm32mp"

# ---------------------------------------------------------------------------
# Packages with broken postinstall scriptlets (Scarthgap no longer supports
# 'exit 1' deferral) that are not needed on this headless board.
# ---------------------------------------------------------------------------
BAD_RECOMMENDATIONS += "alsa-state-script"

# ---------------------------------------------------------------------------
# License
# ---------------------------------------------------------------------------
LICENSE_FLAGS_ACCEPTED = "commercial synaptics-killswitch"

# SD card initial flash: use scripts/flash-sdcard-ab.sh (A/B OTA layout)
# or scripts/flash-sdcard.sh (ST standard layout, no OTA).
# WIC is not used — STM32MP2 FWU metadata embeds hardcoded PARTUUIDs that
# wic cannot match, causing TF-A to fail to find the FIP at boot.
